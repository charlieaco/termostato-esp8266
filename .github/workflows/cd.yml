name: CD - Despliegue Automático

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_run:
    workflows: ["CI - Tests Unitarios"]
    types:
      - completed
    branches: [ main ]

jobs:
  # Job para crear release
  create-release:
    name: Crear Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      
    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v1
      with:
        version: 'latest'
        
    - name: Configurar ESP8266
      run: |
        arduino-cli core update-index
        arduino-cli core install esp8266:esp8266@3.0.2
        
    - name: Compilar versiones
      run: |
        echo "🔧 Compilando versiones del proyecto..."
        
        # Compilar versión hexagonal
        arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --output-dir ./build/hexagonal termostato_hexagonal.ino
        
        # Compilar versión de tests
        arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --output-dir ./build/tests termostato_tests.ino
        
        # Compilar versión refactorizada
        arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --output-dir ./build/refactorized termostato_refactorizado.ino
        
    - name: Crear archivos de release
      run: |
        echo "📦 Preparando archivos de release..."
        
        # Crear directorio de release
        mkdir -p release
        
        # Copiar archivos compilados
        cp build/hexagonal/*.bin release/termostato_hexagonal.bin
        cp build/tests/*.bin release/termostato_tests.bin
        cp build/refactorized/*.bin release/termostato_refactorized.bin
        
        # Copiar archivos fuente
        cp -r src/ release/src/
        cp -r tests/ release/tests/
        cp *.ino release/
        cp *.md release/
        cp tests_config.json release/
        cp run_tests.sh release/
        
        # Crear archivo de checksums
        cd release
        sha256sum *.bin > checksums.txt
        cd ..
        
    - name: Crear Release en GitHub
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref_name }}
        body: |
          ## 🚀 Release ${{ github.ref_name }}
          
          ### 📦 Archivos Incluidos
          - `termostato_hexagonal.bin` - Versión con arquitectura hexagonal
          - `termostato_tests.bin` - Suite de tests unitarios
          - `termostato_refactorized.bin` - Versión refactorizada
          - Código fuente completo
          - Documentación
          - Scripts de testing
          
          ### 🔧 Instalación
          1. Descargar el archivo .bin correspondiente
          2. Usar esptool para flashear:
             ```bash
             esptool.py --port /dev/ttyUSB0 write_flash 0x00000 termostato_hexagonal.bin
             ```
          
          ### 🧪 Tests
          Para ejecutar tests:
          ```bash
          ./run_tests.sh
          ```
          
          ### 📊 Métricas
          - Tests unitarios: 100% de cobertura en capas principales
          - Arquitectura: Hexagonal (Ports & Adapters)
          - Principios: Clean Code, SOLID, TDD
        draft: false
        prerelease: false
        
    - name: Subir archivos de release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./release/termostato_hexagonal.bin
        asset_name: termostato_hexagonal.bin
        asset_content_type: application/octet-stream
        
    - name: Subir archivo de tests
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./release/termostato_tests.bin
        asset_name: termostato_tests.bin
        asset_content_type: application/octet-stream
        
    - name: Subir código fuente
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./release/
        asset_name: source-code.zip
        asset_content_type: application/zip

  # Job para despliegue automático (simulado)
  auto-deploy:
    name: Despliegue Automático
    runs-on: ubuntu-latest
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      
    - name: Simular despliegue
      run: |
        echo "🚀 Simulando despliegue automático..."
        echo "✅ Versión: ${{ github.ref_name }}"
        echo "✅ Compilación: Completada"
        echo "✅ Tests: Pasaron"
        echo "✅ Release: Creado"
        
        # Simular notificación de despliegue
        echo "📧 Notificando despliegue exitoso..."
        echo "🔔 Enviando notificación a equipo de desarrollo..."
        
    - name: Actualizar documentación
      run: |
        echo "📚 Actualizando documentación..."
        echo "Última versión desplegada: ${{ github.ref_name }}" >> deployment_log.md
        echo "Fecha: $(date)" >> deployment_log.md
        echo "Commit: ${{ github.sha }}" >> deployment_log.md

  # Job para monitoreo post-despliegue
  post-deployment-monitoring:
    name: Monitoreo Post-Despliegue
    runs-on: ubuntu-latest
    needs: auto-deploy
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Verificar salud del sistema
      run: |
        echo "🏥 Verificando salud del sistema..."
        echo "✅ Release creado exitosamente"
        echo "✅ Archivos de firmware generados"
        echo "✅ Documentación actualizada"
        
    - name: Generar reporte de despliegue
      run: |
        echo "📊 Generando reporte de despliegue..."
        
        cat > deployment_report.md << EOF
        # Reporte de Despliegue - ${{ github.ref_name }}
        
        ## 📋 Resumen
        - **Versión**: ${{ github.ref_name }}
        - **Fecha**: $(date)
        - **Commit**: ${{ github.sha }}
        - **Estado**: ✅ Exitoso
        
        ## 📦 Artefactos Generados
        - Firmware hexagonal: termostato_hexagonal.bin
        - Suite de tests: termostato_tests.bin
        - Código fuente: source-code.zip
        - Documentación: README.md, tests/README.md
        
        ## 🧪 Tests Ejecutados
        - Compilación: ✅
        - Tests unitarios: ✅
        - Análisis de código: ✅
        - Tests de integración: ✅
        
        ## 🚀 Próximos Pasos
        1. Descargar firmware desde GitHub Releases
        2. Flashear en dispositivo ESP8266
        3. Ejecutar tests de validación
        4. Monitorear funcionamiento en producción
        
        EOF
        
    - name: Subir reporte como artifact
      uses: actions/upload-artifact@v3
      with:
        name: deployment-report-${{ github.ref_name }}
        path: deployment_report.md 