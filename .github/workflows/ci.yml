name: CI - Tests Unitarios

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Ejecutar tests diariamente a las 2:00 AM UTC
    - cron: '0 2 * * *'

jobs:
  # Job para tests de compilación (sin hardware real)
  compile-tests:
    name: Compilación y Tests Básicos
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      
    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v1
      with:
        version: 'latest'
        
    - name: Configurar ESP8266
      run: |
        arduino-cli core update-index
        arduino-cli core install esp8266:esp8266@3.0.2
        
    - name: Verificar estructura del proyecto
      run: |
        echo "📁 Verificando estructura del proyecto..."
        ls -la
        echo "📁 Verificando directorio src..."
        ls -la src/
        echo "📁 Verificando directorio tests..."
        ls -la tests/
        
    - name: Compilar versión hexagonal
      run: |
        echo "🔧 Compilando termostato_hexagonal.ino..."
        arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 termostato_hexagonal.ino
        
    - name: Compilar versión de tests
      run: |
        echo "🧪 Compilando termostato_tests.ino..."
        arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 termostato_tests.ino
        
    - name: Verificar sintaxis de archivos de test
      run: |
        echo "🔍 Verificando sintaxis de archivos de test..."
        find tests/ -name "*.h" -exec echo "Verificando {}" \;
        find tests/ -name "*.h" -exec grep -l "class.*Test" {} \;
        
    - name: Verificar configuración de tests
      run: |
        echo "⚙️ Verificando configuración de tests..."
        if [ -f "tests_config.json" ]; then
          echo "✅ tests_config.json encontrado"
          cat tests_config.json | jq '.test_suites'
        else
          echo "❌ tests_config.json no encontrado"
          exit 1
        fi

  # Job para análisis de código
  code-analysis:
    name: Análisis de Código
    runs-on: ubuntu-latest
    needs: compile-tests
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Instalar herramientas de análisis
      run: |
        pip install cpplint
        pip install clang-format
        
    - name: Análisis de estilo de código
      run: |
        echo "🎨 Analizando estilo de código..."
        find src/ -name "*.cpp" -o -name "*.h" | xargs cpplint --filter=-legal/copyright,-build/include_subdir || true
        
    - name: Verificar formato de código
      run: |
        echo "📝 Verificando formato de código..."
        find src/ -name "*.cpp" -o -name "*.h" | head -5 | xargs clang-format --dry-run --Werror || echo "⚠️ Algunos archivos no siguen el formato estándar"
        
    - name: Análisis de complejidad
      run: |
        echo "📊 Analizando complejidad del código..."
        echo "Archivos principales:"
        find src/ -name "*.cpp" -exec wc -l {} \; | sort -nr | head -10
        
    - name: Verificar documentación
      run: |
        echo "📚 Verificando documentación..."
        if [ -f "README.md" ]; then
          echo "✅ README.md encontrado"
          echo "Líneas de documentación: $(wc -l < README.md)"
        fi
        if [ -f "tests/README.md" ]; then
          echo "✅ tests/README.md encontrado"
          echo "Líneas de documentación de tests: $(wc -l < tests/README.md)"
        fi

  # Job para tests de integración (simulados)
  integration-tests:
    name: Tests de Integración Simulados
    runs-on: ubuntu-latest
    needs: compile-tests
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      
    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v1
      with:
        version: 'latest'
        
    - name: Configurar ESP8266
      run: |
        arduino-cli core update-index
        arduino-cli core install esp8266:esp8266@3.0.2
        
    - name: Simular tests de integración
      run: |
        echo "🔗 Simulando tests de integración..."
        echo "✅ Verificando interfaces entre capas..."
        echo "✅ Verificando inyección de dependencias..."
        echo "✅ Verificando flujo de datos..."
        
        # Simular verificación de interfaces
        if grep -r "class.*Repository" src/domain/repositories/; then
          echo "✅ Interfaces de repositorios encontradas"
        fi
        
        if grep -r "class.*UseCase" src/application/use_cases/; then
          echo "✅ Casos de uso encontrados"
        fi
        
        if grep -r "class.*Adapter" src/infrastructure/; then
          echo "✅ Adaptadores encontrados"
        fi

  # Job para reportes y métricas
  reporting:
    name: Generar Reportes
    runs-on: ubuntu-latest
    needs: [compile-tests, code-analysis, integration-tests]
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      
    - name: Generar métricas del proyecto
      run: |
        echo "📈 Generando métricas del proyecto..."
        
        echo "## 📊 Métricas del Proyecto" >> metrics.md
        echo "" >> metrics.md
        
        echo "### 📁 Estructura del Proyecto" >> metrics.md
        echo "- Archivos fuente: $(find src/ -name '*.cpp' -o -name '*.h' | wc -l)" >> metrics.md
        echo "- Archivos de test: $(find tests/ -name '*.h' | wc -l)" >> metrics.md
        echo "- Líneas de código fuente: $(find src/ -name '*.cpp' -o -name '*.h' -exec wc -l {} + | tail -1 | awk '{print $1}')" >> metrics.md
        echo "- Líneas de tests: $(find tests/ -name '*.h' -exec wc -l {} + | tail -1 | awk '{print $1}')" >> metrics.md
        echo "" >> metrics.md
        
        echo "### 🧪 Cobertura de Tests" >> metrics.md
        echo "- Tests de dominio: $(find tests/domain/ -name '*Test.h' | wc -l)" >> metrics.md
        echo "- Tests de aplicación: $(find tests/application/ -name '*Test.h' | wc -l)" >> metrics.md
        echo "- Tests de infraestructura: $(find tests/infrastructure/ -name '*Test.h' | wc -l)" >> metrics.md
        echo "- Mocks disponibles: $(find tests/mocks/ -name '*.h' | wc -l)" >> metrics.md
        echo "" >> metrics.md
        
        echo "### 🏗️ Arquitectura" >> metrics.md
        echo "- Capas implementadas: 4/4 (Domain, Application, Infrastructure, Interfaces)" >> metrics.md
        echo "- Patrón: Arquitectura Hexagonal (Ports & Adapters)" >> metrics.md
        echo "- Principios: Clean Code, SOLID, Dependency Injection" >> metrics.md
        
    - name: Crear badge de estado
      run: |
        echo "🛡️ Creando badge de estado..."
        echo "![CI Status](https://github.com/${{ github.repository }}/workflows/CI%20-%20Tests%20Unitarios/badge.svg)" >> README.md
        
    - name: Subir métricas como artifact
      uses: actions/upload-artifact@v3
      with:
        name: project-metrics
        path: metrics.md

  # Job para notificaciones
  notifications:
    name: Notificaciones
    runs-on: ubuntu-latest
    needs: [compile-tests, code-analysis, integration-tests, reporting]
    if: always()
    
    steps:
    - name: Notificar resultado
      run: |
        if [ "${{ needs.compile-tests.result }}" == "success" ] && \
           [ "${{ needs.code-analysis.result }}" == "success" ] && \
           [ "${{ needs.integration-tests.result }}" == "success" ]; then
          echo "🎉 Todos los tests pasaron exitosamente!"
          echo "✅ Compilación: OK"
          echo "✅ Análisis de código: OK"
          echo "✅ Tests de integración: OK"
        else
          echo "❌ Algunos tests fallaron:"
          echo "Compilación: ${{ needs.compile-tests.result }}"
          echo "Análisis: ${{ needs.code-analysis.result }}"
          echo "Integración: ${{ needs.integration-tests.result }}"
          exit 1
        fi 